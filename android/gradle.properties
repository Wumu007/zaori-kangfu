# Gradle 守护进程内存：Flutter + AGP 一起跑，2G 容易 OOM，这里给到 4G
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# AndroidX（Flutter 插件全部依赖 AndroidX）
android.useAndroidX=true
# 并行构建，CI 上能省一半时间
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 这两行是 Flutter 官方模板自带的兼容开关，**不能删**。
# AGP 9 默认 android.newDsl=true / builtInKotlin=true，会把 template 之外的
# 旧式写法当成编译错误；关掉后新旧 DSL 都能编。
# ---------------------------------------------------------------------------
android.newDsl=false
android.builtInKotlin=false
