# Gradle 守护进程内存：Flutter + AGP 一起跑，2G 容易 OOM，这里给到 4G
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
# AndroidX（Flutter 插件全部依赖 AndroidX）
android.useAndroidX=true
# 并行构建，CI 上能省一半时间
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 下面两行是 Flutter 官方模板自带的兼容开关，**不能删**。
# AGP 9 默认 android.newDsl=true，会把 android { } / kotlinOptions { } 这些
# 旧写法当成编译错误直接失败；关掉后新旧 DSL 都能编。
# 这两行如果漏了，报错信息只会说「is deprecated」，很难联想到是这里。
# ---------------------------------------------------------------------------
android.newDsl=false
android.builtInKotlin=false

# compileSdk 36 通常比 AGP 的「已验证版本」更新，这行只是压掉一条警告，
# 表示我们清楚风险；真要出问题会在编译期报出来，而不是被静默忽略。
android.suppressUnsupportedCompileSdk=36
