# 早日康复 · Android APK 云端编译
#
# 本仓库只有这一个 Flutter 工程，仓库根目录 = 工程根目录。
# 触发方式：推送到 main，或在 Actions 页面点「Run workflow」手动触发。
name: 早日康复 · Build APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 只读代码，产物通过 artifact 下载，不需要写权限
permissions:
  contents: read

# 同一分支只保留最新一次构建，连续提交时不浪费额度
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: 编译通用 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      # 可选：配了这 4 个 Secrets 就用正式签名，没配则自动退回 debug 签名
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 用当前 stable：插件（speech_to_text 7.4 / flutter_tts 4.2.5）的构建脚本
      # 依赖新版 Flutter 注入的 flutter.compileSdkVersion，用老版本会直接崩在
      # 「Could not get unknown property 'flutter'」。
      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 仓库只保留「必须手写、且容易配错」的 Android 配置：清单文件（权限与
      # 通知接收器）、签名配置、脱糖开关、应用名。其余全部是机械生成物——
      # gradlew / wrapper / AGP 与 Kotlin 版本 / mipmap 图标 / res 资源——
      # 由 flutter create 现场生成，好处是它们天然与当前 Flutter 版本匹配，
      # 不会因为仓库里钉死了旧 AGP 而在半年后突然编不过。
      # cp -rn 的 -n 表示不覆盖：AndroidManifest.xml、app/build.gradle.kts、
      # MainActivity.kt 全部保留仓库版本。
      - name: 补齐 Android 脚手架
        run: |
          rm -rf /tmp/scaffold
          flutter create --org com.medreminder --project-name med_reminder --platforms=android /tmp/scaffold
          cp -rn /tmp/scaffold/android/. android/
          # 若某版模板改成生成 Groovy 构建脚本，会与本仓库的 Kotlin DSL 版
          # 同名共存并报错，这里统一清掉 Groovy 版
          rm -f android/build.gradle android/app/build.gradle android/settings.gradle
          chmod +x android/gradlew
          echo "--- 关键文件确认 ---"
          ls android/settings.gradle.kts android/app/build.gradle.kts android/gradlew android/local.properties
          grep -n "android:label" android/app/src/main/AndroidManifest.xml
          grep -n "compileSdk" android/app/build.gradle.kts

      # ═══════════════════════════════════════════════════════════════
      # V1.9.0：离线语音模型
      # ═══════════════════════════════════════════════════════════════
      # 用户设备的系统语音服务「注册了但不干活」（日志：error code=8、
      # 1.2 秒即 done、系统对话框 4 毫秒返回、系统语音服务=[]），三条
      # 系统路径全废。这里把中文模型直接打进 APK，用 Vosk 离线识别，
      # 不依赖系统、不联网。
      #
      # 模型 32MB，在构建时下载 —— 不进 git 仓库，本地也不需要任何下载。
      - name: 准备离线语音模型
        run: |
          set -e
          mkdir -p android/app/src/main/assets
          URL="https://alphacephei.com/vosk/models/vosk-model-small-cn-0.3.zip"
          curl -L --retry 3 --retry-delay 5 --max-time 600 -o /tmp/model.zip "$URL"
          ls -lh /tmp/model.zip
          # 校验确实是 zip（防止下到错误页面）
          file /tmp/model.zip || true
          unzip -l /tmp/model.zip | head -8
          cp /tmp/model.zip android/app/src/main/assets/vosk-model-zh.zip
          echo "模型已放入 assets：$(du -h android/app/src/main/assets/vosk-model-zh.zip | cut -f1)"

      - name: 拉取依赖
        run: flutter pub get

      # analyze / test 失败不阻断出包：先保证拿到能装的包，问题留在日志里可见
      - name: 静态检查（不阻断）
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 单元测试（不阻断，覆盖 15 组真实口语句）
        continue-on-error: true
        run: flutter test

      - name: 配置正式签名（配了 Secrets 才执行）
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          echo "已启用正式签名，别名：$KEY_ALIAS"

      - name: 编译 Release APK
        run: |
          flutter build apk --release --build-name=1.11.0 --build-number=${GITHUB_RUN_NUMBER}
          echo "--- 产物 ---"
          ls -lh build/app/outputs/flutter-apk/

      - name: 记录产物信息
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          {
            echo "### 早日康复 · APK 构建结果"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | 1.9.0 (build ${GITHUB_RUN_NUMBER}) |"
            echo "| 大小 | $(du -h "$APK" | cut -f1) |"
            echo "| CPU 架构 | universal（arm64-v8a + armeabi-v7a + x86_64） |"
            echo "| SHA256 | \`$(sha256sum "$APK" | cut -d' ' -f1)\` |"
            echo "| 提交 | ${GITHUB_SHA} |"
            echo ""
            echo "在本次运行页面底部的 **Artifacts** 区域下载 \`zaori-kangfu-apk-${GITHUB_RUN_NUMBER}\`。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: zaori-kangfu-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 90
