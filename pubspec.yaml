name: med_reminder
description: 早日康复 App（V2）—— 语音口述录入用药计划、到点本地提醒、按日期回看服药记录，纯本地、不需要登录
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 语音识别：系统级 ASR（iOS Speech / Android SpeechRecognizer），免费、可离线
  speech_to_text: ^7.0.0
  # 语音回读确认（TTS）
  flutter_tts: ^4.0.2
  # 本地通知 + 精确闹钟
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # 本地存储：结构化用药/记录用 sqlite，轻量设置用 SharedPreferences
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # 通知/麦克风/精确闹钟权限与「跳系统设置」
  permission_handler: ^11.3.1

  # 导入/导出：让用户自己挑保存位置（系统「保存到」界面）与备份文件
  #
  # 为什么钉 ^1.0.3 而不是 latest：1.1.0 起要求 Flutter >= 3.35，而本项目
  # 用的是 CI 上的 stable 通道，钉住一个下界低、行为稳定的版本更保险。
  file_selector: ^1.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
